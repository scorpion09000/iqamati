        const memoryStorageFallback = {};
        function safeStorageGet(key) {
            try {
                return window.localStorage.getItem(key);
            } catch (e) {
                return Object.prototype.hasOwnProperty.call(memoryStorageFallback, key) ? memoryStorageFallback[key] : null;
            }
        }
        function safeStorageSet(key, val) {
            try {
                window.localStorage.setItem(key, val);
            } catch (e) {
                memoryStorageFallback[key] = String(val);
            }
        }
        function safeStorageClear() {
            try {
                window.localStorage.clear();
            } catch (e) {
                Object.keys(memoryStorageFallback).forEach(k => delete memoryStorageFallback[k]);
            }
        }

        function initFirebaseSync() {
            try {
                if (typeof firebase === 'undefined') {
                    updateCloudBadge('error');
                    return;
                }
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();

                db.collection(CLOUD_COLLECTION).onSnapshot(snapshot => {
                    isCloudConnected = true;
                    updateCloudBadge('connected');

                    if (snapshot.empty) {
                        const initialPayload = {
                            iq_students: studentsList,
                            iq_staff: staffList,
                            iq_clearances: clearances,
                            iq_guests: guestRequests,
                            iq_maint: maintenanceTickets,
                            iq_social: socialLinks,
                            iq_announcements: announcementsList,
                            iq_shower_settings: showerSettings,
                            iq_shower_bookings: showerBookings,
                            iq_app_settings: appSettings
                        };
                        Object.keys(initialPayload).forEach(k => {
                            db.collection(CLOUD_COLLECTION).doc(k).set({
                                data: initialPayload[k],
                                updatedAt: Date.now()
                            }).catch(e => console.error(e));
                        });
                        return;
                    }

                    let changed = false;
                    snapshot.forEach(doc => {
                        const key = doc.id;
                        const payload = doc.data();
                        if (!payload || payload.data === undefined) return;
                        const val = payload.data;

                        if (key.startsWith('iqamati_logo_')) {
                            if (safeStorageGet(key) !== val) {
                                safeStorageSet(key, val);
                                changed = true;
                            }
                            return;
                        }

                        const serialized = JSON.stringify(val);
                        if (safeStorageGet(key) !== serialized) {
                            safeStorageSet(key, serialized);
                            changed = true;
                        }

                        if (key === 'iq_students') studentsList = val;
                        else if (key === 'iq_staff') staffList = val;
                        else if (key === 'iq_clearances') clearances = val;
                        else if (key === 'iq_guests') guestRequests = val;
                        else if (key === 'iq_maint') maintenanceTickets = val;
                        else if (key === 'iq_social') socialLinks = val;
                        else if (key === 'iq_announcements') announcementsList = val;
                        else if (key === 'iq_shower_settings') showerSettings = val;
                        else if (key === 'iq_shower_bookings') showerBookings = val;
                        else if (key === 'iq_app_settings') appSettings = val;
                    });

                    if (changed && !isUserTyping()) {
                        renderApp();
                    }
                }, err => {
                    console.error("Firestore real-time listener error:", err);
                    isCloudConnected = false;
                    updateCloudBadge('error');
                });
            } catch (err) {
                console.error("Firebase init failed:", err);
                updateCloudBadge('error');
            }

        function generatePwaIconDataUrl(size = 512) {
            try {
                const customLogo = safeStorageGet('iqamati_logo_iqamati');
                if (customLogo && customLogo.startsWith('data:image/')) {
                    return customLogo;
                }
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createLinearGradient(0, 0, size, size);
                grad.addColorStop(0, '#2d064a');
                grad.addColorStop(0.55, '#5b148c');
                grad.addColorStop(1, '#c01c8a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, size, size);

                // Gold roof icon
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = size * 0.06;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(size * 0.22, size * 0.44);
                ctx.lineTo(size * 0.50, size * 0.20);
                ctx.lineTo(size * 0.78, size * 0.44);
                ctx.stroke();

                // Window squares
                ctx.fillStyle = '#fde047';
                ctx.fillRect(size * 0.42, size * 0.36, size * 0.06, size * 0.06);
                ctx.fillRect(size * 0.52, size * 0.36, size * 0.06, size * 0.06);

                // Arabic Brand Name
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.font = `900 ${Math.round(size * 0.20)}px Cairo, sans-serif`;
                ctx.fillText('إقامتي', size * 0.50, size * 0.72);

                ctx.fillStyle = '#fde047';
                ctx.font = `800 ${Math.round(size * 0.08)}px Inter, sans-serif`;
                ctx.fillText('IQAMATI', size * 0.50, size * 0.87);

                return canvas.toDataURL('image/png');
            } catch (e) {
                return '';
            }
        }

        function setupPwaInstall() {
            try {
                const icon192 = generatePwaIconDataUrl(192);
                const icon512 = generatePwaIconDataUrl(512);

                // Set iOS Home Screen Icon
                if (icon512) {
                    let appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
                    if (!appleIcon) {
                        appleIcon = document.createElement('link');
                        appleIcon.rel = 'apple-touch-icon';
                        document.head.appendChild(appleIcon);
                    }
                    appleIcon.href = icon512;
                }

                // Inject dynamic Web App Manifest for Android/Desktop PWA installability
                const manifestObj = {
                    name: "منصة إقامتي - الإقامة الجامعية زوبيدة حمادوش",
                    short_name: "إقامتي",
                    description: "بوابة الخدمات الرقمية للإقامة الجامعية زوبيدة حمادوش - البليدة",

                        { src: icon512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
                    ]
                };
                const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
                const manifestUrl = URL.createObjectURL(manifestBlob);
                let manifestLink = document.querySelector('link[rel="manifest"]');
                if (!manifestLink) {
                    manifestLink = document.createElement('link');
                    manifestLink.rel = 'manifest';
                    document.head.appendChild(manifestLink);
                }
                manifestLink.href = manifestUrl;

                // Capture native Android/Chrome install prompt
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    deferredInstallPrompt = e;

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const el = document.createElement('div');
            const bg = type === 'error' ? 'bg-rose-600' : (type === 'info' ? 'bg-purple-800' : 'bg-emerald-600');
            el.className = `${bg} text-white px-4 py-3 rounded-2xl shadow-xl font-bold text-xs sm:text-sm flex items-center gap-2 pointer-events-auto animate-fade`;
            el.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${msg}</span>`;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.3s';
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        function openModal(title, bodyHtml, footerHtml) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-footer').innerHTML = footerHtml || `<button onclick="closeModal()" class="bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl text-xs">${getText('close')}</button>`;
            document.getElementById('modal-backdrop').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
        }

        function normalizeDob(str) {
            return String(str || '').trim().replace(/[-.\s]/g, '/');
        }

        function dobMatches(input, storedDob) {
            const cleanInput = String(input || '').trim();
            const normIn = normalizeDob(cleanInput);
            const normSt = normalizeDob(storedDob);
            if (normIn === normSt) return true;
            if (cleanInput.replace(/\D/g, '') === normSt.replace(/\D/g, '') && cleanInput.replace(/\D/g, '').length === 8) return true;
            const parts = normSt.split('/');
            if (parts.length === 3) {
                const iso = `${parts[2]}/${parts[1]}/${parts[0]}`;
                if (normIn === iso) return true;
            }
            return false;
        }

        function isClearanceFullyApproved(c) {
            return c && c.step1?.status === 'approved' && c.step2?.status === 'approved' && c.step3?.status === 'approved' && c.step4?.status === 'approved';
        }

        function renderQrSafe(elId, text, size) {
            setTimeout(() => {
                const el = document.getElementById(elId);
                if (el && el.innerHTML === '' && typeof QRCode !== 'undefined') {
                    new QRCode(el, { text, width: size, height: size });
                }
            }, 60);
        }

        function downloadAppHtml() {
            try {
                const clone = document.documentElement.cloneNode(true);
                const clearIds = ['app-root', 'toast-container', 'bottom-nav-root', 'floating-messenger-root', 'modal-body', 'modal-footer'];
                clearIds.forEach(id => {
                    const el = clone.querySelector('#' + id);
                    if (el) el.innerHTML = '';
                });
                const modal = clone.querySelector('#modal-backdrop');
                if (modal) modal.classList.add('hidden');
                const htmlContent = '<!DOCTYPE html>\n' + clone.outerHTML;
                const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'index.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(currentLang === 'ar' ? 'تم تحميل الملف النهائي (index.html) بنجاح!' : 'Final file (index.html) downloaded successfully!');
            } catch (err) {
                showToast(currentLang === 'ar' ? 'تعذر التحميل المباشر، يمكنك نسخ الكود من تبويب الكود.' : 'Direct download failed.', 'error');
            }
        }

                        let badge = `<span class="px-3 py-1 rounded-xl text-xs font-bold bg-slate-100 text-slate-500">${getText('lockedStatus')}</span>`;
                        if (stObj.status === 'approved') badge = `<span class="px-3 py-1 rounded-xl text-xs font-bold bg-emerald-100 text-emerald-800"><i class="fa-solid fa-check-circle me-1"></i>${getText('approvedStatus')}</span>`;

        function submitGuestRequest(e) {
            e.preventDefault();

        function submitMaintenance(e) {
            e.preventDefault();
            const st = currentUser.data;
            const ticket = {
                id: 'MT-' + Math.floor(100 + Math.random() * 900),
                studentRegNo: st.regNo,
                wing: st.wing,
                room: st.room,
                category: document.getElementById('m-cat').value,

                status: 'pending',
                date: new Date().toISOString().split('T')[0]
            };
            maintenanceTickets.unshift(ticket);
            setStoredData('iq_maint', maintenanceTickets);
            showToast(getText('maintSubmittedToast'));
            switchStudentTab('requests');
        }

        function getActiveShowerTicket(regNo) {
            return showerBookings.find(b => b.studentRegNo === regNo && b.status === 'waiting');
        }

        function getShowerRank(ticketId) {
            const active = showerBookings.filter(b => b.status !== 'cancelled').sort((a, b) => a.timestamp - b.timestamp);
            return active.findIndex(b => b.id === ticketId) + 1;
        }

        function renderShowerStudentView(st) {
            const activeTicket = getActiveShowerTicket(st.regNo);
            const rank = activeTicket ? getShowerRank(activeTicket.id) : 0;

            return `
            <div class="max-w-3xl mx-auto space-y-4 animate-fade">
                ${renderBackBar(getText('showerTitle'))}

                <div class="bg-white rounded-3xl p-6 border border-purple-100 shadow-sm space-y-5 text-center">
                    <div class="w-16 h-16 mx-auto rounded-2xl ${showerSettings.isOpen ? 'bg-cyan-100 text-cyan-700' : 'bg-rose-100 text-rose-700'} flex items-center justify-center text-3xl">
                        <i class="fa-solid fa-shower"></i>
                    </div>

                    <div>
                        <span class="inline-block px-4 py-1.5 rounded-full text-xs font-black ${showerSettings.isOpen ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                            ${showerSettings.isOpen ? getText('showerStatusOpen') : getText('showerStatusClosed')}
                        </span>
                        ${showerSettings.sessionNote ? `<p class="text-xs sm:text-sm font-bold text-slate-600 mt-2">${showerSettings.sessionNote}</p>` : ''}

                            <p>${getText('showerAlreadyBooked')}</p>
                            <p class="text-lg font-black text-cyan-800">${getText('showerQueueRank')}: #${rank}</p>
                            <button onclick="switchStudentTab('requests')" class="bg-cyan-700 hover:bg-cyan-800 text-white font-bold px-4 py-2 rounded-xl text-xs transition">
                                <i class="fa-solid fa-ticket me-1"></i> ${getText('serviceRequests')}
                            </button>
                        </div>
                    ` : ''}

                        <button onclick="bookShowerTicket()" ${(!showerSettings.isOpen || activeTicket) ? 'disabled' : ''} class="py-4 rounded-2xl font-black text-sm transition flex items-center justify-center gap-2 shadow-md ${(!showerSettings.isOpen || activeTicket) ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-cyan-700 hover:bg-cyan-800 text-white'}">
                            <i class="fa-solid fa-ticket"></i> ${getText('showerBookBtn')}
                        </button>
                        <button onclick="cancelShowerTicket()" ${!activeTicket ? 'disabled' : ''} class="py-4 rounded-2xl font-black text-sm transition flex items-center justify-center gap-2 shadow-md ${!activeTicket ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-rose-600 hover:bg-rose-700 text-white'}">
                            <i class="fa-solid fa-ban"></i> ${getText('showerCancelBtn')}
                        </button>
                    </div>
                </div>
            </div>
            `;
        }

        function bookShowerTicket() {
            if (!showerSettings.isOpen) {
                showToast(getText('showerClosedToast'), 'error');
                return;
            }
            const st = currentUser.data;
            if (getActiveShowerTicket(st.regNo)) return;
            const now = new Date();
            const ticket = {
                id: 'SH-' + Math.floor(1000 + Math.random() * 9000),
                studentRegNo: st.regNo,
                studentNameAr: st.nameAr,
                studentNameEn: st.nameEn,
                wing: st.wing,
                room: st.room,
                status: 'waiting',
                timestamp: Date.now(),
                bookedAt: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' - ' + now.toISOString().split('T')[0]
            };
            showerBookings.push(ticket);
            setStoredData('iq_shower_bookings', showerBookings);
            showToast(getText('showerBookedToast'));
            switchStudentTab('requests');
        }

        function cancelShowerTicket() {
            const st = currentUser.data;
            const idx = showerBookings.findIndex(b => b.studentRegNo === st.regNo && b.status === 'waiting');
            if (idx === -1) return;
            showerBookings[idx].status = 'cancelled';
            setStoredData('iq_shower_bookings', showerBookings);
            showToast(getText('showerCancelledToast'), 'info');
            renderApp();
        }

        function changeStudentPassword(e) {
            e.preventDefault();
            const st = currentUser.data;
            const oldP = document.getElementById('cp-old').value.trim();
            const newP = document.getElementById('cp-new').value.trim();
            const confP = document.getElementById('cp-confirm').value.trim();

            const validOld = st.password ? (oldP === st.password) : dobMatches(oldP, st.dob);
            if (!validOld) {
                showToast(currentLang === 'ar' ? 'كلمة المرور الحالية غير صحيحة' : 'Current password is incorrect', 'error');
                return;
            }
            if (newP.length < 4) {
                showToast(currentLang === 'ar' ? 'يجب أن تكون كلمة المرور 4 أحرف على الأقل' : 'Password must be at least 4 characters', 'error');
                return;
            }
            if (newP !== confP) {
                showToast(currentLang === 'ar' ? 'كلمتا المرور غير متطابقتين' : 'Passwords do not match', 'error');
                return;
            }
            const idx = studentsList.findIndex(s => s.regNo === st.regNo);
            if (idx !== -1) {
                studentsList[idx].password = newP;
                setStoredData('iq_students', studentsList);
                currentUser.data = studentsList[idx];
                showToast(currentLang === 'ar' ? 'تم تحديث كلمة المرور بنجاح' : 'Password updated successfully');
                renderApp();
            }
        }

        /* =========================================================================
           10. DEPARTMENT STAFF DASHBOARDS
           ========================================================================= */
        function renderStaffDashboard() {
            const role = currentUser.data.role;
            if (role === 'admin') return renderAdminDashboard();
            if (role === 'director') return renderDirectorDashboard();
            if (role === 'maintenance') return renderMaintenanceStaffDashboard();
            if (role === 'shower') return renderShowerStaffDashboard();

            const stepMap = { bayada: 'step1', library: 'step2', pavillon: 'step3', iwaya: 'step4' };
            const prevMap = { bayada: null, library: 'step1', pavillon: 'step2', iwaya: 'step3' };
            const stepKey = stepMap[role];
            const prevKey = prevMap[role];

            return `
            <div class="space-y-5 animate-fade">
                <div class="iq-gradient rounded-3xl p-5 text-white shadow-lg">
                    <h2 class="text-xl font-black text-amber-300">${currentLang === 'ar' ? currentUser.data.nameAr : currentUser.data.nameEn}</h2>
                    <p class="text-xs text-purple-100 mt-1">${currentUser.data.dept} — ${getText('clearanceTitle')}</p>
                </div>

                <div class="space-y-3">
                    ${studentsList.map(st => {
                        const c = clearances[st.regNo] || { step1:{status:'pending'}, step2:{status:'pending'}, step3:{status:'pending',equipOk:false,keyOk:false}, step4:{status:'pending'} };
                        const prevApproved = !prevKey || c[prevKey]?.status === 'approved';
                        const cur = c[stepKey] || { status: 'pending' };

                        return `
                        <div class="bg-white rounded-3xl p-5 border border-purple-100 shadow-sm space-y-3">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                <div>
                                    <h4 class="font-black text-purple-950 text-sm sm:text-base">${currentLang === 'ar' ? st.nameAr : st.nameEn}</h4>
                                    <p class="text-xs text-slate-500">${st.regNo} | ${getText('wing')} ${st.wing} - ${getText('room')} ${st.room}</p>
                                </div>
                                <span class="px-3 py-1 rounded-xl text-xs font-bold self-start ${cur.status === 'approved' ? 'bg-emerald-100 text-emerald-800' : (cur.status === 'rejected' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800')}">
                                    ${cur.status === 'approved' ? getText('approvedStatus') : (cur.status === 'rejected' ? getText('rejectedStatus') : getText('pendingStatus'))}
                                </span>
                            </div>

                            ${!prevApproved ? `
                                <p class="text-xs font-bold text-amber-700 bg-amber-50 p-3 rounded-xl border border-amber-200">
                                    <i class="fa-solid fa-lock me-1"></i> ${getText('lockedStatus')}
                                </p>
                            ` : `
                                ${role === 'pavillon' ? `
                                    <div class="flex flex-col sm:flex-row gap-3 bg-purple-50 p-3 rounded-2xl text-xs font-bold text-purple-950">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" id="equip-${st.regNo}" ${cur.equipOk ? 'checked' : ''} class="w-4 h-4 accent-purple-800">
                                            ${getText('step3EquipCheck')}
                                        </label>
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" id="key-${st.regNo}" ${cur.keyOk ? 'checked' : ''} class="w-4 h-4 accent-purple-800">
                                            ${getText('step3KeyCheck')}
                                        </label>
                                    </div>
                                ` : ''}
                                <div class="flex flex-wrap gap-2">
                                    <button onclick="updateClearanceStep('${st.regNo}', '${stepKey}', 'approved')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition">${getText('actionApprove')}</button>
                                    <button onclick="updateClearanceStep('${st.regNo}', '${stepKey}', 'rejected')" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition">${getText('actionReject')}</button>
                                </div>
                            `}
                        </div>
                        `;
                    }).join('')}
                </div>
            </div>
            `;
        }

        function updateClearanceStep(regNo, stepKey, status) {
            if (!clearances[regNo]) {
                clearances[regNo] = { step1:{status:'pending'}, step2:{status:'pending'}, step3:{status:'pending',equipOk:false,keyOk:false}, step4:{status:'pending'} };
            }
            if (stepKey === 'step3' && status === 'approved') {
                const eq = document.getElementById('equip-' + regNo)?.checked;
                const ky = document.getElementById('key-' + regNo)?.checked;
                if (!eq || !ky) {
                    showToast(currentLang === 'ar' ? 'يجب التأشير على حالة الغرفة/العتاد وتسليم المفتاح أولاً!' : 'Please check both room condition and key return first!', 'error');
                    return;
                }
                clearances[regNo].step3.equipOk = true;
                clearances[regNo].step3.keyOk = true;
            }
            clearances[regNo][stepKey] = {
                ...clearances[regNo][stepKey],
                status: status,
                date: new Date().toISOString().split('T')[0]
            };
            setStoredData('iq_clearances', clearances);
            showToast(currentLang === 'ar' ? 'تم تحديث حالة التبرئة بنجاح' : 'Clearance status updated');
            renderApp();
        }

                        </div>
                    `).join('')}

        function renderShowerStaffDashboard() {

        /* --- EXCEL IMPORT / EXPORT (SHEETJS) --- */
        function importStudentsExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    let added = 0;
                    rows.forEach(r => {
                        const regNo = String(r.regNo || r['رقم التسجيل'] || '').trim();
                        if (!regNo) return;
                        const obj = {
                            regNo,
                            dob: String(r.dob || r['تاريخ الميلاد'] || '01/01/2003').trim(),
                            nameAr: String(r.nameAr || r['الاسم'] || regNo).trim(),
                            nameEn: String(r.nameEn || r.nameAr || regNo).trim(),
                            wing: String(r.wing || r['الجناح'] || 'A').trim(),
                            room: String(r.room || r['الغرفة'] || '101').trim(),
                            majorAr: String(r.majorAr || r['التخصص'] || 'جامعي').trim(),
                            majorEn: String(r.majorEn || 'University').trim()
                        };
                        const idx = studentsList.findIndex(s => s.regNo === regNo);
                        if (idx === -1) { studentsList.push(obj); added++; } else { studentsList[idx] = { ...studentsList[idx], ...obj }; }
                    });
                    setStoredData('iq_students', studentsList);

        async function downloadElementPNG(elId, filename) {
            const el = document.getElementById(elId);
            if (!el || typeof html2canvas === 'undefined') return;
            const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff' });
            const a = document.createElement('a');
            a.download = filename + '.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
        }

        async function downloadElementPDF(elId, filename) {
            const el = document.getElementById(elId);
            if (!el || typeof html2canvas === 'undefined' || !window.jspdf) return;
            const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff' });
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgW = 190;
            const imgH = (canvas.height * imgW) / canvas.width;
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 10, 10, imgW, imgH);
            pdf.save(filename + '.pdf');
        }

        function uploadCustomLogo(type, e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    try {
                        const maxDim = 360;
                        let w = img.width;
                        let h = img.height;
                        if (w > maxDim || h > maxDim) {
                            const ratio = Math.min(maxDim / w, maxDim / h);
                            w = Math.round(w * ratio);
                            h = Math.round(h * ratio);
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const compressedDataUrl = canvas.toDataURL('image/png');

                        const key = 'iqamati_logo_' + type;
                        safeStorageSet(key, compressedDataUrl);
                        if (db) {
                            db.collection(CLOUD_COLLECTION).doc(key).set({
                                data: compressedDataUrl,
                                updatedAt: Date.now()
                            }).catch(err => console.error("Logo cloud sync error:", err));
                        }
                        showToast(currentLang === 'ar' ? 'تم تحديث ومزامنة الشعار سحابياً بنجاح' : 'Logo updated & synced to cloud');
                        renderApp();
                        openLogoManagerModal();
                    } catch (err) {
                        showToast(currentLang === 'ar' ? 'حجم الصورة كبير جداً' : 'Image too large', 'error');
                    }
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }
