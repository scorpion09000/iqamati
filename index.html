    <script>
        /* =========================================================================
           0. SAFE STORAGE HELPERS (SANDBOX-SAFE WITH MEMORY FALLBACK)
           ========================================================================= */
        const memoryStorageFallback = {};
        function safeStorageGet(key) {
            try {
                return window.localStorage.getItem(key);
            } catch (e) {
                return Object.prototype.hasOwnProperty.call(memoryStorageFallback, key) ? memoryStorageFallback[key] : null;
            }
        }
        function safeStorageSet(key, val) {
            try {
                window.localStorage.setItem(key, val);
            } catch (e) {
                memoryStorageFallback[key] = String(val);
            }
        }
        function safeStorageClear() {
            try {
                window.localStorage.clear();
            } catch (e) {
                Object.keys(memoryStorageFallback).forEach(k => delete memoryStorageFallback[k]);
            }
        }

        function cloneDefaultShowerSettings() {
            return JSON.parse(JSON.stringify(defaultShowerSettings));
        }

        function normalizeShowerSettings(raw) {
            if (!raw || !Array.isArray(raw.schedule) || raw.schedule.length !== 7) {
                return cloneDefaultShowerSettings();
            }
            const validModes = ['auto', 'force_open', 'force_closed'];
            return {
                mode: validModes.includes(raw.mode) ? raw.mode : 'auto',
                schedule: defaultShowerSettings.schedule.map((def, idx) => {
                    const found = raw.schedule.find(s => Number(s.day) === idx) || def;
                    return {
                        day: idx,
                        enabled: Boolean(found.enabled),
                        bookingStart: found.bookingStart || def.bookingStart,
                        bookingEnd: found.bookingEnd || def.bookingEnd,
                        showerStart: found.showerStart || def.showerStart,
                        showerEnd: found.showerEnd || def.showerEnd
                    };
                })
            };
        }

        function timeToMinutes(hhmm) {
            if (!hhmm || typeof hhmm !== 'string') return 0;
            const parts = hhmm.split(':');
            return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
        }

        function getShowerBookingState() {
            const settings = normalizeShowerSettings(showerSettings);
            const now = new Date();
            const curDay = now.getDay();
            const curMins = now.getHours() * 60 + now.getMinutes();

            const todayRule = settings.schedule.find(s => s.day === curDay);
            let isOpen = false;
            let activeRule = null;

            if (settings.mode === 'force_open') {
                isOpen = true;
                activeRule = (todayRule && todayRule.enabled) ? todayRule : null;
            } else if (settings.mode === 'force_closed') {
                isOpen = false;
            } else {
                if (todayRule && todayRule.enabled) {
                    const bStart = timeToMinutes(todayRule.bookingStart);
                    const bEnd = timeToMinutes(todayRule.bookingEnd);
                    if (curMins >= bStart && curMins < bEnd) {
                        isOpen = true;
                        activeRule = todayRule;
                    }
                }
            }

            let nextSlot = null;
            for (let offset = 0; offset < 7; offset++) {
                const checkDay = (curDay + offset) % 7;
                const rule = settings.schedule.find(s => s.day === checkDay);
                if (!rule || !rule.enabled) continue;
                const bStart = timeToMinutes(rule.bookingStart);
                if (offset === 0 && curMins >= bStart) continue;
                nextSlot = { ...rule, isToday: offset === 0 };
                break;
            }
            if (!nextSlot && todayRule && todayRule.enabled) {
                nextSlot = { ...todayRule, isToday: false };
            }

            return {
                isOpen,
                mode: settings.mode,
                activeRule,
                todayRule,
                nextSlot,
                schedule: settings.schedule
            };
        }

        function initFirebaseSync() {
            try {
                if (typeof firebase === 'undefined') {
                    updateCloudBadge('error');
                    return;
                }
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();

                // Subscribe to each allowed document individually to comply with strict Firestore Rules (docId allowlist)
                CLOUD_DOC_KEYS.forEach(key => {
                    db.collection(CLOUD_COLLECTION).doc(key).onSnapshot(doc => {
                        isCloudConnected = true;
                        cloudErrorLogged = false;
                        updateCloudBadge('connected');

                        if (!doc.exists) {
                            if (!key.startsWith('iqamati_logo_')) {
                                const initialVal = getLocalValueForCloudKey(key);
                                if (initialVal !== undefined) {
                                    db.collection(CLOUD_COLLECTION).doc(key).set({
                                        data: initialVal,
                                        updatedAt: Date.now()
                                    }).catch(e => {
                                        if (!cloudErrorLogged) {
                                            cloudErrorLogged = true;
                                            console.warn("Firestore seed skipped:", e.code || e.message);
                                        }
                                    });
                                }
                            }
                            return;
                        }

                        const payload = doc.data();
                        if (!payload || payload.data === undefined) return;
                        let val = payload.data;
                        let changed = false;

                        if (key.startsWith('iqamati_logo_')) {
                            if (safeStorageGet(key) !== val) {
                                safeStorageSet(key, val);
                                changed = true;
                            }
                        } else {
                            if (key === 'iq_shower_settings') {
                                val = normalizeShowerSettings(val);
                            }

                            const serialized = JSON.stringify(val);
                            if (safeStorageGet(key) !== serialized) {
                                safeStorageSet(key, serialized);
                                changed = true;
                            }

                            if (key === 'iq_students') studentsList = val;
                            else if (key === 'iq_staff') staffList = val;
                            else if (key === 'iq_clearances') clearances = val;
                            else if (key === 'iq_guests') guestRequests = val;
                            else if (key === 'iq_maint') maintenanceTickets = val;
                            else if (key === 'iq_social') socialLinks = val;
                            else if (key === 'iq_announcements') announcementsList = val;
                            else if (key === 'iq_shower_settings') showerSettings = val;
                            else if (key === 'iq_shower_bookings') showerBookings = val;
                            else if (key === 'iq_app_settings') appSettings = val;
                        }

                        if (changed) {
                            scheduleCloudRender();
                        }
                    }, err => {
                        isCloudConnected = false;
                        updateCloudBadge('error');
                        if (!cloudErrorLogged) {
                            cloudErrorLogged = true;
                            console.warn("Firestore sync fallback to local mode:", err.code || err.message);
                        }
                    });
                });
            } catch (err) {
                console.warn("Firebase init fallback:", err.message || err);
                updateCloudBadge('error');
            }
        }

        function showToast(msg, type = 'success') {

            const bg = type === 'error' ? 'bg-rose-600' : (type === 'info' ? 'bg-purple-800' : 'bg-emerald-600');
            el.className = `${bg} text-white px-4 py-3 rounded-2xl shadow-xl font-bold text-xs sm:text-sm flex items-center gap-2 pointer-events-auto animate-fade`;
            el.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${msg}</span>`;
            container.appendChild(el);
            setTimeout(() => {

                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

            document.getElementById('modal-backdrop').classList.remove('hidden');

        function toWesternDigits(str) {
            return String(str == null ? '' : str)
                .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))
                .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0));
        }

        function formatExcelDob(rawVal) {
            if (rawVal === undefined || rawVal === null || rawVal === '') return '';
            if (rawVal instanceof Date && !isNaN(rawVal.getTime())) {
                const dd = String(rawVal.getDate()).padStart(2, '0');
                const mm = String(rawVal.getMonth() + 1).padStart(2, '0');
                const yyyy = rawVal.getFullYear();
                return `${dd}/${mm}/${yyyy}`;
            }
            if (typeof rawVal === 'number' && rawVal > 1000 && rawVal < 100000) {
                if (typeof XLSX !== 'undefined' && XLSX.SSF && XLSX.SSF.parse_date_code) {
                    const parsed = XLSX.SSF.parse_date_code(rawVal);
                    if (parsed && parsed.y && parsed.m && parsed.d) {
                        return `${String(parsed.d).padStart(2, '0')}/${String(parsed.m).padStart(2, '0')}/${parsed.y}`;
                    }
                }
                const utcDays = Math.floor(rawVal - 25569);
                const dt = new Date(utcDays * 86400 * 1000);
                const dd = String(dt.getUTCDate()).padStart(2, '0');
                const mm = String(dt.getUTCMonth() + 1).padStart(2, '0');
                return `${dd}/${mm}/${dt.getUTCFullYear()}`;
            }
            const str = toWesternDigits(String(rawVal)).trim();
            if (/^\d{5}$/.test(str)) {
                return formatExcelDob(Number(str));
            }
            const isoMatch = str.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
            if (isoMatch) {
                return `${isoMatch[3].padStart(2, '0')}/${isoMatch[2].padStart(2, '0')}/${isoMatch[1]}`;
            }
            const dmyMatch = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
            if (dmyMatch) {
                let yr = dmyMatch[3];
                if (yr.length === 2) yr = (Number(yr) > 30 ? '19' : '20') + yr;
                return `${dmyMatch[1].padStart(2, '0')}/${dmyMatch[2].padStart(2, '0')}/${yr}`;
            }
            return str;
        }

        function parseDobParts(str) {
            const clean = toWesternDigits(formatExcelDob(str)).trim();
            const norm = clean.replace(/[-.\s]+/g, '/');
            const parts = norm.split('/').filter(Boolean);
            if (parts.length === 3) {
                const a = parseInt(parts[0], 10);
                const b = parseInt(parts[1], 10);
                const c = parseInt(parts[2], 10);
                if (parts[0].length === 4) {
                    return { d: c, m: b, y: a };
                }
                let y = c;
                if (parts[2].length === 2) y = (c > 30 ? 1900 : 2000) + c;
                return { d: a, m: b, y };
            }
            const digits = clean.replace(/\D/g, '');
            if (digits.length === 8) {
                if (digits.startsWith('19') || digits.startsWith('20')) {
                    return { y: parseInt(digits.slice(0, 4), 10), m: parseInt(digits.slice(4, 6), 10), d: parseInt(digits.slice(6, 8), 10) };
                }
                return { d: parseInt(digits.slice(0, 2), 10), m: parseInt(digits.slice(2, 4), 10), y: parseInt(digits.slice(4, 8), 10) };
            }
            return null;
        }

        function dobMatches(input, storedDob) {
            const rawIn = toWesternDigits(String(input || '')).trim();
            const rawSt = toWesternDigits(String(storedDob || '')).trim();
            if (!rawIn || !rawSt) return false;
            if (rawIn === rawSt) return true;

            const pIn = parseDobParts(rawIn);
            const pSt = parseDobParts(rawSt);
            if (pIn && pSt) {
                if (pIn.y === pSt.y && pIn.m === pSt.m && pIn.d === pSt.d) return true;
                if (pIn.y === pSt.y && pIn.d === pSt.m && pIn.m === pSt.d) return true;
            }
            return false;
        }

        function isClearanceFullyApproved(c) {
            return c && c.step1?.status === 'approved' && c.step2?.status === 'approved' && c.step3?.status === 'approved' && c.step4?.status === 'approved';
        }

        function downloadAppHtml() {
            try {
                const clone = document.documentElement.cloneNode(true);
                const clearIds = ['app-root', 'toast-container', 'bottom-nav-root', 'floating-messenger-root', 'modal-body', 'modal-footer'];
                clearIds.forEach(id => {
                    const el = clone.querySelector('#' + id);
                    if (el) el.innerHTML = '';
                });
                const modal = clone.querySelector('#modal-backdrop');
                if (modal) modal.classList.add('hidden');
                const htmlContent = '<!DOCTYPE html>\n' + clone.outerHTML;
                const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'index.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(currentLang === 'ar' ? 'تم تحميل الملف النهائي (index.html) بنجاح!' : 'Final file (index.html) downloaded successfully!');
            } catch (err) {
                showToast(currentLang === 'ar' ? 'تعذر التحميل المباشر، يمكنك نسخ الكود من تبويب الكود.' : 'Direct download failed.', 'error');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const rawId = document.getElementById('login-id').value.trim();
            const idVal = toWesternDigits(rawId).replace(/\s+/g, '');
            const passVal = toWesternDigits(document.getElementById('login-pass').value.trim());

            if (loginTab === 'student') {
                const st = studentsList.find(s => toWesternDigits(String(s.regNo || '')).replace(/\s+/g, '') === idVal);
                if (st) {
                    const valid = st.password
                        ? (passVal === toWesternDigits(String(st.password)).trim())
                        : dobMatches(passVal, st.dob);
                    if (valid) {
                        currentUser = { type: 'student', data: st };
                        activeStudentTab = 'home';
                        showToast(getText('welcomeBack'));
                        renderApp();
                        return;
                    }
                }
            } else {
                const staff = staffList.find(s => s.username.toLowerCase() === rawId.toLowerCase() && s.password === document.getElementById('login-pass').value.trim());
                if (staff) {
                    currentUser = { type: 'staff', data: staff };
                    showToast(currentLang === 'ar' ? `مرحباً ${staff.nameAr}` : `Welcome ${staff.nameEn}`);
                    renderApp();
                    return;
                }
            }
            showToast(getText('invalidCreds'), 'error');
        }

            const active = showerBookings.filter(b => b.status !== 'cancelled').sort((a, b) => a.timestamp - b.timestamp);
            return active.findIndex(b => b.id === ticketId) + 1;
        }

        function renderShowerStudentView(st) {
            const activeTicket = getActiveShowerTicket(st.regNo);
            const rank = activeTicket ? getShowerRank(activeTicket.id) : 0;

            let statusDetail = '';
            if (state.isOpen) {
                if (state.activeRule) {
                    statusDetail = currentLang === 'ar'
                        ? `فترة الحجز الجارية: ${state.activeRule.bookingStart} — ${state.activeRule.bookingEnd} (توقيت المرش: ${state.activeRule.showerStart} — ${state.activeRule.showerEnd})`

                        ? 'الحجز مفتوح حالياً بقرار من المشرف العام'
                        : 'Booking is currently open by Super Admin';

                    ? 'الحجز مغلق مؤقتاً بقرار من المشرف العام'

                    ? (currentLang === 'ar' ? `اليوم (${getDayName(state.nextSlot.day)})` : `Today (${getDayName(state.nextSlot.day)})`)

                statusDetail = currentLang === 'ar'
                    ? `الموعد القادم للحجز: ${dayLabel} من ${state.nextSlot.bookingStart} إلى ${state.nextSlot.bookingEnd}`

            return `
            <div class="max-w-3xl mx-auto space-y-4 animate-fade">
                ${renderBackBar(getText('showerTitle'))}

                <div class="bg-white rounded-3xl p-6 border border-purple-100 shadow-sm space-y-5 text-center">

        function bookShowerTicket() {
            const state = getShowerBookingState();
            if (!state.isOpen) {
                showToast(getText('showerClosedToast'), 'error');
                renderApp();
                return;
            }
            const st = currentUser.data;
            if (getActiveShowerTicket(st.regNo)) return;
            const now = new Date();
            const sessionLabel = state.activeRule
                ? `${getDayName(state.activeRule.day)} (${state.activeRule.showerStart} - ${state.activeRule.showerEnd})`
                : now.toISOString().split('T')[0];

            const ticket = {
                id: 'SH-' + Math.floor(1000 + Math.random() * 9000),
                studentRegNo: st.regNo,
                studentNameAr: st.nameAr,
                studentNameEn: st.nameEn,
                wing: st.wing,
                room: st.room,
                status: 'waiting',
                sessionLabel,
                timestamp: Date.now(),
                bookedAt: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' - ' + now.toISOString().split('T')[0]
            };
            showerBookings.push(ticket);
            setStoredData('iq_shower_bookings', showerBookings);
            showToast(getText('showerBookedToast'));
            switchStudentTab('requests');
        }

        function cancelShowerTicket() {
            const st = currentUser.data;
            const idx = showerBookings.findIndex(b => b.studentRegNo === st.regNo && b.status === 'waiting');
            if (idx === -1) return;
            showerBookings[idx].status = 'cancelled';
            setStoredData('iq_shower_bookings', showerBookings);
            showToast(getText('showerCancelledToast'), 'info');
            renderApp();
        }

        function changeStudentPassword(e) {
            e.preventDefault();
            const st = currentUser.data;
            const oldP = toWesternDigits(document.getElementById('cp-old').value.trim());
            const newP = document.getElementById('cp-new').value.trim();
            const confP = document.getElementById('cp-confirm').value.trim();

            const validOld = st.password ? (oldP === toWesternDigits(String(st.password)).trim()) : dobMatches(oldP, st.dob);
            if (!validOld) {
                showToast(currentLang === 'ar' ? 'كلمة المرور الحالية غير صحيحة' : 'Current password is incorrect', 'error');
                return;
            }
            if (newP.length < 4) {
                showToast(currentLang === 'ar' ? 'يجب أن تكون كلمة المرور 4 أحرف على الأقل' : 'Password must be at least 4 characters', 'error');
                return;
            }
            if (newP !== confP) {
                showToast(currentLang === 'ar' ? 'كلمتا المرور غير متطابقتين' : 'Passwords do not match', 'error');
                return;
            }
            const idx = studentsList.findIndex(s => s.regNo === st.regNo);
            if (idx !== -1) {
                studentsList[idx].password = newP;
                setStoredData('iq_students', studentsList);
                currentUser.data = studentsList[idx];
                showToast(currentLang === 'ar' ? 'تم تحديث كلمة المرور بنجاح' : 'Password updated successfully');
                renderApp();
            }
        }

        function updateClearanceStep(regNo, stepKey, status) {
            if (!clearances[regNo]) {

            }
            if (stepKey === 'step3' && status === 'approved') {

                const ky = document.getElementById('key-' + regNo)?.checked;
                if (!eq || !ky) {

                }
                clearances[regNo].step3.equipOk = true;
                clearances[regNo].step3.keyOk = true;
            }
            clearances[regNo][stepKey] = {
                ...clearances[regNo][stepKey],
                status: status,
                date: new Date().toISOString().split('T')[0]

        function saveAdminShowerSchedule(e) {
            e.preventDefault();
            try {
                const mode = document.getElementById('admin-shower-mode')?.value || 'auto';
                const newSchedule = [];
                for (let day = 0; day < 7; day++) {
                    const enabled = Boolean(document.getElementById('sh-en-' + day)?.checked);
                    const bookingStart = document.getElementById('sh-bs-' + day)?.value || '18:00';
                    const bookingEnd = document.getElementById('sh-be-' + day)?.value || '19:00';
                    const showerStart = document.getElementById('sh-ss-' + day)?.value || '19:00';
                    const showerEnd = document.getElementById('sh-se-' + day)?.value || '21:00';
                    newSchedule.push({ day, enabled, bookingStart, bookingEnd, showerStart, showerEnd });
                }
                showerSettings = { mode, schedule: newSchedule };
                setStoredData('iq_shower_settings', showerSettings);
                showToast(getText('showerScheduleSavedToast'));
                renderApp();
            } catch (err) {
                console.error("Save shower schedule error:", err);
                showToast(currentLang === 'ar' ? 'حدث خطأ أثناء حفظ مواقيت المرش' : 'Error saving schedule', 'error');
            }
        }

        function updateAdminCredentials(e) {
            e.preventDefault();
            try {
                const newUsername = document.getElementById('admin-new-username').value.trim();
                const currPass = document.getElementById('admin-curr-pass').value.trim();
                const newPass = document.getElementById('admin-new-pass').value.trim();
                const confirmPass = document.getElementById('admin-confirm-pass').value.trim();

                const idx = staffList.findIndex(s => s.role === 'admin' && s.username === currentUser.data.username);
                if (idx === -1) {
                    showToast(currentLang === 'ar' ? 'تعذر العثور على حساب المشرف العام' : 'Admin account not found', 'error');
                    return;
                }

                if (currPass !== staffList[idx].password) {
                    showToast(currentLang === 'ar' ? 'كلمة المرور الحالية غير صحيحة' : 'Current password is incorrect', 'error');
                    return;
                }

                if (!newUsername || newUsername.length < 3) {
                    showToast(currentLang === 'ar' ? 'يجب أن يكون اسم المستخدم 3 أحرف على الأقل' : 'Username must be at least 3 characters', 'error');
                    return;
                }

                const duplicate = staffList.some((s, i) => i !== idx && s.username.toLowerCase() === newUsername.toLowerCase());
                if (duplicate) {
                    showToast(currentLang === 'ar' ? 'اسم المستخدم مستخدم بالفعل لحساب آخر' : 'Username is already taken by another account', 'error');
                    return;
                }

                if (newPass) {
                    if (newPass.length < 4) {
                        showToast(currentLang === 'ar' ? 'يجب أن تكون كلمة المرور الجديدة 4 أحرف على الأقل' : 'New password must be at least 4 characters', 'error');
                        return;
                    }
                    if (newPass !== confirmPass) {
                        showToast(currentLang === 'ar' ? 'كلمتا المرور الجديدتان غير متطابقتين' : 'New passwords do not match', 'error');
                        return;
                    }
                    staffList[idx].password = newPass;
                }

                staffList[idx].username = newUsername;
                setStoredData('iq_staff', staffList);
                currentUser.data = staffList[idx];

                showToast(getText('adminCredsUpdatedToast'));
                renderApp();
            } catch (err) {
                console.error("Admin credentials update error:", err);
                showToast(currentLang === 'ar' ? 'حدث خطأ أثناء تحديث البيانات' : 'Error updating credentials', 'error');
            }
        }

        /* --- EXCEL IMPORT / EXPORT (SHEETJS WITH SMART DATE & HEADER NORMALIZATION) --- */
        function getRowField(normRow, keys) {
            for (const k of keys) {
                const nk = k.trim().toLowerCase();
                if (normRow[nk] !== undefined && normRow[nk] !== null && String(normRow[nk]).trim() !== '') {
                    return normRow[nk];
                }
            }
            return '';
        }

        function importStudentsExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array', cellDates: true });
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { raw: true });
                    let added = 0;
                    let updated = 0;
                    rows.forEach(r => {
                        const normRow = {};
                        Object.keys(r).forEach(k => {
                            normRow[String(k).trim().toLowerCase()] = r[k];
                        });

                        const rawReg = getRowField(normRow, ['regno', 'رقم التسجيل', 'رقم_التسجيل', 'matricule', 'id', 'الرقم']);
                        const regNo = toWesternDigits(String(rawReg)).replace(/\s+/g, '');
                        if (!regNo) return;

                        const rawDob = getRowField(normRow, ['dob', 'تاريخ الميلاد', 'تاريخ_الميلاد', 'تاريخ الازدياد', 'تاريخ الإزدياد', 'date de naissance', 'date_naissance', 'birthdate', 'date']);
                        const dobFormatted = formatExcelDob(rawDob) || '01/01/2003';

                        const nameAr = String(getRowField(normRow, ['namear', 'الاسم', 'الاسم واللقب', 'الاسم الكامل', 'اللقب والاسم', 'nom']) || regNo).trim();
                        const nameEn = String(getRowField(normRow, ['nameen', 'name', 'full name']) || nameAr).trim();
                        const wing = String(getRowField(normRow, ['wing', 'الجناح', 'pavillon', 'bloc']) || 'A').trim();
                        const room = String(getRowField(normRow, ['room', 'الغرفة', 'chambre', 'رقم الغرفة']) || '101').trim();
                        const majorAr = String(getRowField(normRow, ['majorar', 'التخصص', 'الشعبة', 'filiere', 'spécialité']) || 'جامعي').trim();
                        const majorEn = String(getRowField(normRow, ['majoren', 'major']) || majorAr).trim();

                        const obj = { regNo, dob: dobFormatted, nameAr, nameEn, wing, room, majorAr, majorEn };
                        const idx = studentsList.findIndex(s => toWesternDigits(String(s.regNo)).replace(/\s+/g, '') === regNo);
                        if (idx === -1) {
                            studentsList.push(obj);
                            added++;
                        } else {
                            studentsList[idx] = { ...studentsList[idx], ...obj };
                            updated++;
                        }
                    });
                    setStoredData('iq_students', studentsList);
                    showToast(currentLang === 'ar'
                        ? `تم استيراد ${added} طالبة جديدة وتحديث ${updated} طالبة بنجاح`
                        : `Imported ${added} new & updated ${updated} students`);
                    renderApp();
                } catch (err) {
                    console.error("Student Excel import error:", err);
                    showToast(currentLang === 'ar' ? 'حدث خطأ في قراءة ملف Excel' : 'Excel error', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function importStaffExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    let added = 0;
                    rows.forEach(r => {
                        const username = String(r.username || r['اسم المستخدم'] || '').trim();
                        if (!username) return;
                        const obj = {
                            username,
                            password: String(r.password || r['كلمة المرور'] || '1234').trim(),
                            role: String(r.role || r['الدور'] || 'bayada').trim(),
                            nameAr: String(r.nameAr || r['الاسم'] || username).trim(),
                            nameEn: String(r.nameEn || username).trim(),
                            dept: String(r.dept || r.role || '').trim()
                        };
                        if (!staffList.some(s => s.username === username)) { staffList.push(obj); added++; }
                    });
                    setStoredData('iq_staff', staffList);
                    showToast(currentLang === 'ar' ? `تم استيراد ${added} مشرف بنجاح` : `Imported ${added} supervisors`);
                    renderApp();
                } catch (err) {
                    showToast('Excel error', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function exportAllToExcel() {
            if (typeof XLSX === 'undefined') return;
            const wb = XLSX.utils.book_new();

        async function downloadElementPNG(elId, filename) {
            const el = document.getElementById(elId);
            if (!el || typeof html2canvas === 'undefined') return;
            const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff' });
            const a = document.createElement('a');
            a.download = filename + '.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
        }

        async function downloadElementPDF(elId, filename) {
            const el = document.getElementById(elId);
            if (!el || typeof html2canvas === 'undefined' || !window.jspdf) return;
            const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff' });
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgW = 190;
            const imgH = (canvas.height * imgW) / canvas.width;
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 10, 10, imgW, imgH);
            pdf.save(filename + '.pdf');
        }

        function uploadCustomLogo(type, e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    try {
                        const maxDim = 360;
                        let w = img.width;
                        let h = img.height;
                        if (w > maxDim || h > maxDim) {
                            const ratio = Math.min(maxDim / w, maxDim / h);
                            w = Math.round(w * ratio);
                            h = Math.round(h * ratio);
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const compressedDataUrl = canvas.toDataURL('image/png');

                        const key = 'iqamati_logo_' + type;
                        safeStorageSet(key, compressedDataUrl);
                        if (db) {
                            db.collection(CLOUD_COLLECTION).doc(key).set({
                                data: compressedDataUrl,
                                updatedAt: Date.now()
                            }).catch(err => console.error("Logo cloud sync error:", err));
                        }
                        showToast(currentLang === 'ar' ? 'تم تحديث ومزامنة الشعار سحابياً بنجاح' : 'Logo updated & synced to cloud');
                        renderApp();
                        openLogoManagerModal();
                    } catch (err) {
                        showToast(currentLang === 'ar' ? 'حجم الصورة كبير جداً' : 'Image too large', 'error');
                    }
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        /* =========================================================================
           15. MASTER RENDER & SAFE INITIALIZATION (WITH AUTO SHOWER CLOCK REFRESH)
           ========================================================================= */
        function renderApp() {
            applyLanguage();
            const root = document.getElementById('app-root');
            if (!root) return;
            if (!currentUser) {
                root.innerHTML = renderLoginScreen();
            } else if (currentUser.type === 'student') {
                root.innerHTML = renderStudentPortal();
            } else {
                root.innerHTML = renderStaffDashboard();
            }
            renderStudentOverlays();
        }

        function startShowerClockWatcher() {
            setInterval(() => {
                if (!currentUser || isUserTyping()) return;
                const isViewingShower =
                    (currentUser.type === 'student' && activeStudentTab === 'shower') ||
                    (currentUser.type === 'staff' && currentUser.data.role === 'shower') ||
                    (currentUser.type === 'staff' && currentUser.data.role === 'director' && activeDirectorTab === 'shower');
                if (isViewingShower) {
                    renderApp();
                }
            }, 30000);
        }

        function bootApp() {
            setupPwaInstall();
            renderApp();
            initFirebaseSync();
            startShowerClockWatcher();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootApp);
        } else {
            bootApp();
        }
    </script>
